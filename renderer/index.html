<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OhMyShokz</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app-container">
    <!-- Left Panel: Work Area -->
    <section class="work-panel">
      <header class="app-header">
        <h1>OhMyShokz</h1>
        <p class="subtitle">YouTube to Shokz Workflow</p>
      </header>

      <div class="input-card">
        <div class="url-input-wrapper">
          <input id="urlInput" type="text" placeholder="여기에 유튜브 링크를 붙여넣으세요..." autofocus />
          <button id="loadVideoButton" class="btn-icon" title="영상 불러오기">
            🔄
          </button>
        </div>
      </div>

      <div class="video-card">
        <div class="video-wrapper">
          <div id="videoFrame"></div>
          <div class="placeholder-text">영상 미리보기</div>
        </div>

        <!-- Fallback / Controls Overlay -->
        <div id="fallbackPanel" class="fallback-panel hidden">
          <div class="fallback-header">
            <strong id="fallbackTitle">퍼가기 금지됨</strong>
            <span class="hint">아래 슬라이더로 구간을 선택하세요</span>
          </div>
          <div class="fallback-controls">
            <input id="fallbackStartRange" type="range" class="range-slider" min="0" max="100" value="0" />
            <input id="fallbackEndRange" type="range" class="range-slider" min="0" max="100" value="100" />
          </div>
          <div class="range-labels">
            <span id="fallbackStartLabel">00:00</span>
            <span id="fallbackEndLabel">00:00</span>
          </div>
        </div>

        <div class="player-controls">
          <div class="time-inputs">
            <div class="time-group">
              <label>시작 시간</label>
              <input id="startInput" type="text" placeholder="00:00:00" />
              <button id="setStartFromPlayerButton" class="btn-small" title="현재 시간으로 설정">📍</button>
            </div>
            <div class="time-group">
              <label>종료 시간</label>
              <input id="endInput" type="text" placeholder="00:00:00" />
              <button id="setEndFromPlayerButton" class="btn-small" title="현재 시간으로 설정">📍</button>
            </div>
          </div>
          <button id="applyFallbackRangeButton" class="btn-text hidden">구간 적용</button>
          <button id="openInBrowserButton" class="btn-text">브라우저에서 열기</button>
        </div>
      </div>
    </section>

    <!-- Right Panel: Result Area -->
    <section class="result-panel">
      <div class="status-card">
        <div class="device-status">
          <span class="icon">🎧</span>
          <div class="device-info">
            <strong>기기 연결 상태</strong>
            <select id="deviceSelect"></select>
          </div>
          <button id="refreshDevicesButton" class="btn-icon" title="새로고침">🔄</button>
          <button id="pickDeviceFolderButton" class="btn-icon" title="폴더 선택">📂</button>
        </div>
        <div class="storage-info hidden">
          <!-- Future: Storage usage bar -->
        </div>
      </div>

      <div class="action-card">
        <div class="folder-picker">
          <label>저장할 폴더:</label>
          <input id="folderInput" type="text" readonly placeholder="폴더를 선택하세요..." />
          <button id="pickFolderButton" class="btn-small">찾기</button>
        </div>

        <div class="primary-actions">
          <button id="downloadButton" class="btn-primary btn-large">
            <span class="icon">⬇️</span> MP3로 변환하기
          </button>
          <button id="addToQueueButton" class="btn-secondary">
            <span class="icon">➕</span> 대기 목록에 추가
          </button>
          <button id="addChaptersToQueueButton" class="btn-secondary hidden">
            <span class="icon">📚</span> 챕터별 대기 목록에 추가
          </button>
        </div>

        <div class="secondary-actions">
          <button id="downloadQueueButton" class="btn-text">모두 변환하기</button>
          <button id="installToolsButton" class="btn-text">도구 자동 설치</button>
          <button id="refreshFilesButton" class="btn-text">파일 목록 갱신</button>
        </div>
        <div id="statusText" class="status-message">준비됨</div>
      </div>

      <div class="tabs">
        <input type="radio" name="list-tab" id="tab-queue" checked>
        <label for="tab-queue">대기 목록</label>

        <input type="radio" name="list-tab" id="tab-files">
        <label for="tab-files">변환된 파일</label>

        <div class="tab-content content-queue">
          <div id="queueList" class="list-container"></div>
        </div>
        <div class="tab-content content-files">
          <div id="filesList" class="list-container"></div>
        </div>
      </div>

      <details class="log-drawer">
        <summary>Terminal Logs</summary>
        <pre id="logText"></pre>
      </details>
    </section>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="./renderer.js"></script>
</body>

</html>
