name: Build DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build DMG
        run: npm run dist -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyShokz-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            ## macOS 최초 실행

            이 앱은 Apple Developer ID 공증을 받지 않은 개인 배포 앱입니다.

            처음 실행할 때 macOS가 차단하면 앱을 한 번 실행한 뒤 `시스템 설정 > 개인정보 보호 및 보안`에서 OhMyShokz의 `그래도 열기`를 누르세요. 확인 창에서 다시 `열기`를 선택하면 이후에는 평소처럼 실행할 수 있습니다.

            `xattr` 명령은 필요하지 않습니다. 회사에서 관리하는 Mac은 보안 정책에 따라 실행이 제한될 수 있습니다.
